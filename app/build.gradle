plugins {
    id 'com.android.application'
}

android {
    namespace 'com.codex.nothingisland'
    compileSdk 36

    defaultConfig {
        applicationId 'com.codex.nothingisland'
        minSdk 29
        targetSdk 36
        versionCode 3
        versionName '1.2.0'
    }

    buildTypes {
        release {
            // Direct-download release APK; signed with Android's local debug key.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}
